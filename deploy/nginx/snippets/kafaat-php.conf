# تمرير إلى PHP-FPM — يُضمَّن من مواضع عدّة، فالمصدر واحد لا نسخ متفرّقة.
# /etc/nginx/snippets/kafaat-php.conf

fastcgi_pass kafaat_php;
include fastcgi_params;

# المدخل واحد دائماً: index.php. لا نشتقّ اسم الملف من المسار إطلاقاً —
# اشتقاقه هو أصل ثغرة تنفيذ الملفات المرفوعة في تهيئات nginx/PHP الشائعة.
fastcgi_param SCRIPT_FILENAME $document_root/index.php;
fastcgi_param SCRIPT_NAME /index.php;
fastcgi_param PATH_INFO "";
fastcgi_param QUERY_STRING $query_string;
fastcgi_param REQUEST_URI $request_uri;

# TLS ينتهي عند nginx — التطبيق يحتاج معرفة أن الأصل آمن ليبني روابط https
fastcgi_param HTTPS on;

fastcgi_hide_header X-Powered-By;
fastcgi_read_timeout 60s;
fastcgi_buffers 16 16k;
fastcgi_buffer_size 32k;
fastcgi_keep_conn on;
