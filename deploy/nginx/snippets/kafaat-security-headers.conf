# ════════════════════════════════════════════════════════════
#  ترويسات الأمان — تُضمَّن في كل كتلة location تحمل add_header خاصاً بها.
#
#  ⚠ قاعدة nginx التي تُوقع الجميع: add_header داخل location لا يُضاف إلى
#  ترويسات الـserver بل **يُلغيها كلها**. فكتلةٌ فيها add_header Cache-Control
#  واحد تُسقط الترويسات الستّ أدناه بصمت. وهو ما وقع فعلاً: وثيقة SPA
#  الرئيسية — التي تُحمّل وتُشغّل كل جافاسكربت المنصّة — كانت تُقدَّم بلا CSP
#  ولا X-Frame-Options إطلاقاً، بينما تحملها مسارات /api.
# ════════════════════════════════════════════════════════════

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "same-origin" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
# الحزمة مبنيّة مسبقاً ولا تجلب من الخارج. 'unsafe-inline' للأنماط وحدها
# لأن Vue يحقن أنماطاً مضمّنة — ولا يُمنح للسكربتات.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
