# ════════════════════════════════════════════════════════════
#  مدخل البوّابة على خادم التطبيق — يستقبل من الـDMZ وحده.
#  /etc/nginx/sites-available/kafaat-app-portal.conf   (الخادم الثاني)
#
#  منفذ منفصل (8443) لا الـ443 الداخلي: الفصل يجعل قاعدة الجدار الناري
#  دقيقة (الـDMZ يصل 8443 فقط) ويمنع بلوغَ شاشات الموظفين من الخارج
#  حتى لو أخطأ أحدٌ في إعداد الوسيط الخارجي.
# ════════════════════════════════════════════════════════════

server {
    listen 10.10.10.20:8443 ssl http2;
    server_name kafaat.gov.sa;

    # شهادة داخلية موقّعة من CA المؤسسة — الـDMZ يتحقّق منها (proxy_ssl_verify)
    ssl_certificate     /etc/ssl/kafaat/app-internal.fullchain.pem;
    ssl_certificate_key /etc/ssl/kafaat/app-internal.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    # ثقة متبادلة: لا يقبل هذا المنفذ إلا عميلاً يحمل شهادة الـDMZ.
    # الجدار الناري يحصر المصدر، وهذه تحصر الهوية — طبقتان لا واحدة.
    ssl_client_certificate /etc/ssl/kafaat/internal-ca.pem;
    ssl_verify_client on;

    root /srv/kafaat/current/public;
    charset utf-8;
    client_max_body_size 1m;
    server_tokens off;

    # المسارات الأربعة نفسها المسموح بها في الـDMZ — تكرار القيد مقصود:
    # حاجزٌ واحد يسقط بخطأ إعداد واحد، وحاجزان يلزمهما خطآن متزامنان.
    location ~ ^/api/public/assessment/[A-Za-z0-9]{20,64}/(verify|confirm|arrive|cv)$ {
        include /etc/nginx/snippets/kafaat-php.conf;
    }

    location / { return 404; }

    access_log /var/log/nginx/kafaat-portal.access.log;
    error_log  /var/log/nginx/kafaat-portal.error.log warn;
}
