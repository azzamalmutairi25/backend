# ════════════════════════════════════════════════════════════
#  الوسيط الداخلي — المنصّة لموظّفي المركز (الشبكة الداخلية فقط).
#  /etc/nginx/sites-available/kafaat-internal.conf
#
#  جذر واحد: حزمة الواجهة تُنسخ داخل public/ الخاص بلارافيل، فتُخدَم
#  الواجهة والـAPI من الأصل نفسه — لا CORS، ولا عنوان مخبوز في الحزمة
#  (VITE_API_URL فارغ ⇒ المسار النسبي /api).
# ════════════════════════════════════════════════════════════

upstream kafaat_php {
    server unix:/run/php/kafaat.sock;
    keepalive 32;
}

# تقييد معدّل عند الحافة — طبقة أمام مُقيِّد Laravel. سببها أن مُقيِّد التطبيق
# لا يُنفَّذ إلا بعد إقلاع PHP كاملاً: هجمةٌ تُشبع العمّال قبل أن تبلغ المُقيِّد.
limit_req_zone $binary_remote_addr zone=kafaat_api:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=kafaat_login:10m rate=1r/s;
limit_conn_zone $binary_remote_addr zone=kafaat_conn:10m;

server {
    listen 80;
    server_name kafaat.internal.gov.sa;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name kafaat.internal.gov.sa;

    ssl_certificate     /etc/ssl/kafaat/internal.fullchain.pem;
    ssl_certificate_key /etc/ssl/kafaat/internal.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:kafaat_tls:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    root /srv/kafaat/current/public;

    charset utf-8;
    client_max_body_size 12m;   # يفوق سقف وثيقة السيرة (128KB) بهامش واسع
    limit_conn kafaat_conn 40;

    # ── ترويسات الأمان ──
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    # الحزمة مبنيّة مسبقاً ولا تجلب من الخارج. 'unsafe-inline' للأنماط وحدها
    # لأن Vue يحقن أنماطاً مضمّنة — ولا يُمنح للسكربتات.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # ── الدخول أضيق: رشّ كلمات المرور يُردّ عند الحافة (قبل /api/) ──
    location = /api/login {
        limit_req zone=kafaat_login burst=5 nodelay;
        include /etc/nginx/snippets/kafaat-php.conf;
    }

    # ── الـAPI ──
    location /api/ {
        limit_req zone=kafaat_api burst=40 nodelay;
        include /etc/nginx/snippets/kafaat-php.conf;
    }

    # فحص حياة التطبيق (مسار /up من الإطار) — للمراقبة
    location = /up {
        access_log off;
        include /etc/nginx/snippets/kafaat-php.conf;
    }

    # ── أصول الواجهة: مبصومة بالمحتوى فتُخزَّن أبداً ──
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # ── SPA: أي مسار غير معروف يعود إلى index.html ──
    # index.html نفسه لا يُخزَّن: هو الذي يحمل أسماء الأصول الجديدة بعد كل نشر،
    # وتخزينه يُبقي المتصفّح على حزمة قديمة تطلب أصولاً حُذفت.
    location = /index.html {
        add_header Cache-Control "no-store" always;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }

    # لا تنفيذ لأي PHP عبر المسار — المداخل محصورة أعلاه
    location ~ \.php$ { return 404; }

    location ~ /\.(?!well-known) { deny all; }
    location ~ ~$ { deny all; }

    access_log /var/log/nginx/kafaat-internal.access.log;
    error_log  /var/log/nginx/kafaat-internal.error.log warn;
}
