# ════════════════════════════════════════════════════════════
#  بوّابة المرشح العامة — الخادم الأول (DMZ)، مكشوف للإنترنت.
#  /etc/nginx/sites-available/kafaat-dmz.conf
#
#  هذا الخادم لا يشغّل PHP ولا يلمس قاعدة البيانات: nginx وحده يخدم حزمة
#  البوّابة الساكنة، ويمرّر أربعة مسارات فقط إلى خادم التطبيق الداخلي.
#  سطح الهجوم المكشوف = ملفات ساكنة + أربعة مسارات محدّدة بالاسم.
#
#  حزمة البوّابة منفصلة عن حزمة المنصّة (`npm run build:public`): لا تستورد
#  أي شاشة داخلية ولا أي مفتاح صلاحية، ومدخلها public.html لا index.html.
# ════════════════════════════════════════════════════════════

upstream kafaat_app {
    server 10.10.10.20:8443;
    keepalive 16;
}

limit_req_zone $binary_remote_addr zone=dmz_portal:10m rate=5r/s;
limit_conn_zone $binary_remote_addr zone=dmz_conn:10m;

server {
    listen 80 default_server;
    server_name _;
    return 301 https://kafaat.gov.sa$request_uri;
}

server {
    # الصيغة القديمة عمداً: `http2 on;` تعليمةٌ لا يعرفها nginx قبل 1.25.1
    # فيسقط الإقلاع، بينما هذه تعمل على النسختين (تنبيه إهمالٍ على الأحدث
    # لا خطأ). والملفّان الآخران يستعملانها، فلا يُشترط إصدارٌ واحد بينها.
    listen 443 ssl http2 default_server;
    server_name kafaat.gov.sa;

    ssl_certificate     /etc/ssl/kafaat/public.fullchain.pem;
    ssl_certificate_key /etc/ssl/kafaat/public.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_stapling on;
    ssl_stapling_verify on;
    ssl_session_cache shared:dmz_tls:10m;
    ssl_session_tickets off;

    # ناتج `npm run build:public` — مدخله public.html
    root /srv/kafaat-portal/current;

    charset utf-8;
    client_max_body_size 1m;      # البوّابة ترسل JSON صغيراً فقط
    limit_conn dmz_conn 20;
    server_tokens off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # ══ المسارات الأربعة الوحيدة المسموح تمريرها ══
    # قائمة بيضاء صريحة لا نمط عام: البوّابة العامة لا تصل إلا ما تحتاجه،
    # فلا يبلغ الإنترنتُ /api/candidates ولا /api/users ولو تغيّرت المسارات.
    location ~ "^/api/public/assessment/[A-Za-z0-9]{20,64}/(verify|confirm|arrive|cv)$" {
        limit_req zone=dmz_portal burst=10 nodelay;

        proxy_pass https://kafaat_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        # الحقيقة التي يعتمد عليها تقييد المعدّل وسجل التدقيق في التطبيق.
        # لا معنى لها ما لم يكن عنوان هذا الخادم في TRUSTED_PROXIES.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;

        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
        proxy_ssl_verify on;
        proxy_ssl_trusted_certificate /etc/ssl/kafaat/internal-ca.pem;
    }

    # أي مسار /api آخر لا وجود له بالنسبة للإنترنت
    location /api/ { return 404; }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # مدخل حزمة البوّابة هو public.html لا index.html
    #
    # ⚠ الترويسات الخمس مُكرَّرة هنا عمداً ولا تُحذف: `add_header` داخل كتلةٍ
    # يُلغي كل ترويسات الكتلة الأعلى لا يُضيف إليها. وبدون هذا التكرار تُقدَّم
    # صفحةُ البوّابة — وهي الوحيدة المكشوفة للإنترنت — بلا CSP ولا HSTS ولا
    # حماية من التأطير، بينما تحملها بقيةُ الملفات الساكنة.
    location = /public.html {
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        add_header Cache-Control "no-store" always;
    }
    location / {
        try_files $uri $uri/ /public.html;
    }

    location ~ /\.(?!well-known) { deny all; }

    access_log /var/log/nginx/kafaat-dmz.access.log;
    error_log  /var/log/nginx/kafaat-dmz.error.log warn;
}
