# ════════════════════════════════════════════════════════════
#  ضبط PostgreSQL 16 — الخادم الثالث (4 vCPU / 16 GB / SSD)
#  /etc/postgresql/16/main/conf.d/kafaat-tuning.conf
#  (تأكّد أن postgresql.conf فيه: include_dir = 'conf.d')
# ════════════════════════════════════════════════════════════

# ── الاتصالات ──
# خادم التطبيق يفتح: 32 عامل FPM + 2 عامل طابور + المجدول ≈ 40 اتصالاً.
# 100 تعطي هامشاً للصيانة والنسخ الاحتياطي بلا إفراط: كل اتصال ذاكرةٌ مستقلّة.
# ⚠ لا تحتاج PgBouncer عند هذا الحجم — يضيف نقطة فشل بلا مكسب. وإن أُضيف
#   لاحقاً في وضع transaction فاضبط max_prepared_statements=200، وإلا
#   انهارت العبارات المُحضَّرة التي يستعملها لارافيل افتراضياً.
max_connections = 100
superuser_reserved_connections = 5

# ── الذاكرة ──
shared_buffers = 4GB                  # ٢٥٪ من ذاكرة الخادم
effective_cache_size = 12GB           # تقدير ما يخبّئه النظام — يوجّه المخطّط
work_mem = 16MB                       # لكل عملية فرز/تجزئة، لا لكل اتصال
maintenance_work_mem = 512MB          # VACUUM وبناء الفهارس
huge_pages = try

# ── القرص ──
random_page_cost = 1.1                # SSD: القراءة العشوائية كالتسلسلية تقريباً
effective_io_concurrency = 200
default_statistics_target = 100

# ── سجل الكتابة المسبقة (WAL) ──
# replica لا minimal: يسمح بنسخة احتياطية ساخنة وباستعادة نقطة زمنية (PITR)
# دون إعادة تشغيل لاحقة. الفرق في الأداء مهمل، والفرق في الاسترجاع جوهري.
wal_level = replica
max_wal_size = 4GB
min_wal_size = 1GB
checkpoint_timeout = 15min
checkpoint_completion_target = 0.9
wal_compression = on

# أرشفة WAL — شرط الاستعادة إلى لحظة ما قبل الخطأ لا إلى نسخة الليلة
archive_mode = on
archive_command = 'test ! -f /var/backups/kafaat/wal/%f && cp %p /var/backups/kafaat/wal/%f'
archive_timeout = 300

# ── التشفير أثناء النقل ──
# بيانات المشاركين مشفّرة في الحقول، لكن الاستعلامات والنتائج تمرّ على الشبكة
# نصّاً بلا هذا. مطلبٌ صريح في ضوابط الهيئة الوطنية للأمن السيبراني.
ssl = on
ssl_cert_file = '/etc/ssl/kafaat/db.fullchain.pem'
ssl_key_file = '/etc/ssl/kafaat/db.key'
ssl_min_protocol_version = 'TLSv1.2'

# ── السجلّات ──
logging_collector = on
log_directory = 'log'
log_filename = 'postgresql-%Y-%m-%d.log'
log_rotation_age = 1d
log_rotation_size = 100MB
# كل استعلام يتجاوز نصف ثانية يُسجَّل — به يُكتشف الاستعلام الذي ينمو مع البيانات
log_min_duration_statement = 500
log_checkpoints = on
log_connections = on
log_disconnections = on
log_lock_waits = on
log_temp_files = 0
log_autovacuum_min_duration = 0
log_line_prefix = '%m [%p] %q%u@%d '

# ── التنظيف التلقائي ──
# أكثر عدوانية من الافتراضي: جداول التدقيق والجلسات تتضخّم سريعاً
autovacuum = on
autovacuum_max_workers = 3
autovacuum_naptime = 30s
autovacuum_vacuum_scale_factor = 0.05
autovacuum_analyze_scale_factor = 0.02

# ── المهل ──
# معاملة مفتوحة منسيّة تحجز الصفوف وتعطّل التنظيف — تُقطع بعد دقيقة
idle_in_transaction_session_timeout = 60s
statement_timeout = 60s               # يطابق request_terminate_timeout في FPM
lock_timeout = 10s

# ── الإحصاءات ──
shared_preload_libraries = 'pg_stat_statements'
pg_stat_statements.max = 10000
pg_stat_statements.track = top
track_io_timing = on

timezone = 'Asia/Riyadh'
