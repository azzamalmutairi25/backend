; ════════════════════════════════════════════════════════════
;  مجمّع PHP-FPM للمنصّة — /etc/php/8.3/fpm/pool.d/kafaat.conf
;  احذف مجمّع www الافتراضي: /etc/php/8.3/fpm/pool.d/www.conf
;
;  الحجم مبنيّ على خادم تطبيق 8 vCPU / 16 GB.
; ════════════════════════════════════════════════════════════

[kafaat]

user = kafaat
group = kafaat

listen = /run/php/kafaat.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660
; طابور الاتصالات الواردة: أقصر منه يرفض nginx تحت الاندفاع القصير
listen.backlog = 511

; ── حجم المجمّع ──
; PHP هنا مقيّد بالإدخال/الإخراج (قاعدة بيانات + Redis) لا بالمعالج، فالعامل
; ينتظر أكثر ممّا يحسب. القاعدة العملية: 4× الأنوية.
;   ٥٠ مستخدماً متزامناً ≈ ٦–١٧ طلباً/ثانية مستقرّة، وذروة ~٥٠ عند بداية الدوام.
;   بمتوسّط ٨٠ مللي للطلب: 50 × 0.08 ≈ 4 عمّال مشغولين — و32 هامشٌ ×8.
; كل عامل ~70 ميغابايت ⇒ 32 × 70 ≈ 2.2 غيغا، من 16 متاحة.
pm = dynamic
pm.max_children = 32
pm.start_servers = 8
pm.min_spare_servers = 4
pm.max_spare_servers = 12
; إعادة تدوير العامل بعد ٥٠٠ طلب — احتياطٌ ضد تسريب ذاكرة تراكمي
pm.max_requests = 500
pm.process_idle_timeout = 30s

; ── الرصد ──
pm.status_path = /fpm-status
ping.path = /fpm-ping
; كل طلب يتجاوز ٥ ثوانٍ يُسجَّل بأثره الكامل — به تُعرف النقطة البطيئة
slowlog = /var/log/php/kafaat-slow.log
request_slowlog_timeout = 5s
; حدّ قاطع: طلبٌ تجاوز ٦٠ ثانية عالقٌ لا بطيء، ويحجز عاملاً عن غيره
request_terminate_timeout = 60s

catch_workers_output = yes
decorate_workers_output = no

; ── حدود PHP ──
php_admin_value[memory_limit] = 256M
php_admin_value[post_max_size] = 12M
php_admin_value[upload_max_filesize] = 12M
php_admin_value[max_execution_time] = 60
php_admin_value[error_log] = /var/log/php/kafaat-error.log
php_admin_flag[log_errors] = on
; لا تُطبَع الأخطاء في الاستجابة أبداً — تُفصح بمسارات الملفات وبنية الشيفرة
php_admin_flag[display_errors] = off
php_admin_value[expose_php] = 0

; ── حصر ما يُقرأ ويُكتب ──
; حتى لو نُفِّذت شيفرة، لا تبلغ /etc ولا مجلدات المستخدمين
php_admin_value[open_basedir] = /srv/kafaat:/tmp:/usr/share/php
php_admin_value[disable_functions] = exec,passthru,shell_exec,system,proc_open,popen,pcntl_exec
php_admin_value[session.save_handler] = redis
php_admin_value[session.save_path] = "tcp://127.0.0.1:6379"

; ── متغيّرات البيئة ──
; TRUSTED_PROXIES و API_RATE_LIMIT تُقرآن من config/security.php لا من هنا،
; فتنجوان من config:cache. لا تُعرّفهما هنا كي لا يوجد مصدران للحقيقة.
env[APP_ENV] = production
