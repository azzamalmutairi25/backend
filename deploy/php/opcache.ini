; ════════════════════════════════════════════════════════════
;  /etc/php/8.3/fpm/conf.d/99-kafaat-opcache.ini
;
;  بلا opcache تُعاد ترجمة كل ملف PHP في كل طلب. هذا وحده أكبر فارق
;  أداء منفرد في نشر لارافيل — وهو سطران لا هندسة.
; ════════════════════════════════════════════════════════════

opcache.enable = 1
opcache.enable_cli = 0

; لارافيل + الحزم ≈ ٤٠٠٠ ملف. نضاعف الهامش فلا تُطرَد ملفات ساخنة.
opcache.memory_consumption = 256
opcache.interned_strings_buffer = 32
opcache.max_accelerated_files = 20000

; صفر = لا يفحص تغيّر الملفات إطلاقاً. صحيح في الإنتاج لأن النشر يُعيد
; تحميل php-fpm فيُبطِل الذاكرة كاملةً — ويوفّر stat() لكل ملف في كل طلب.
; ⚠ لولا إعادة التحميل في سكربت النشر لبقي الخادم على الشيفرة القديمة أبداً.
opcache.validate_timestamps = 0
opcache.revalidate_freq = 0

opcache.save_comments = 1        ; لارافيل يقرأ التعليقات التوضيحية — لا تُطفئها
opcache.fast_shutdown = 1
opcache.enable_file_override = 0

; ── تخزين الأصفاد المترجَمة على القرص ──
; يجعل أول طلب بعد إعادة التحميل سريعاً بدل أن يدفع ثمن الترجمة كاملاً
opcache.file_cache = /var/cache/php/opcache
opcache.file_cache_only = 0

; JIT: مكسبه في الشيفرة الحسابية، وحمل الويب مقيّد بالإدخال/الإخراج.
; يبقى مطفأً — تعقيد بلا عائد قابل للقياس هنا.
opcache.jit = disable
opcache.jit_buffer_size = 0
